<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign in</title>
        <link rel="stylesheet" href="Login.css">
    </head>

    <body>
        <main class="form">
            <h1>Login Here</h1>
            <form action="#" method="post">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Enter email here"
                       autocomplete="email" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter password here"
                       autocomplete="current-password" required>

                <button class="btn" type="submit">Login</button>
            </form>

            <p class="link">Don't have an account? <a href="register.html">register here</a></p>
        </main>
    </body>
</html>
